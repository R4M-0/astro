name: astro-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: astro
      POSTGRES_DB: astro
    ports: ["127.0.0.1:${ASTRO_PG_PORT:-5434}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: astro
      MINIO_ROOT_PASSWORD: astro-secret
    ports: ["127.0.0.1:9010:9000", "127.0.0.1:9011:9001"]
    volumes: [miniodata:/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1026:1025", "127.0.0.1:8026:8025"]
  # Vector DB for the graph service: XQdrant, our Qdrant fork with dims_explained (per-dimension score explanations).
  # Plain Qdrant also works (explanations are then computed in the graph service): ASTRO_QDRANT_IMAGE=qdrant/qdrant:latest
  qdrant:
    image: ${ASTRO_QDRANT_IMAGE:-golden5ragon/xqdrant:latest}
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]
volumes:
  pgdata:
  miniodata:
  qdrantdata:
