packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Security floors for transitive advisories (see docs/security-audit.md)
overrides:
  multer: '>=2.3.0'
  socket.io-parser: '>=4.2.7'
  postcss: '>=8.5.23'
  js-yaml@>=4: '>=4.3.2'
  qs: '>=6.16.0'
  deepmerge-ts: '>=8.0.0'
  nanoid@<3.3.18: '>=3.3.18'
  # dev toolchain transitives (nest cli / jest / eslint)
  fast-uri: '>=3.1.6'
  brace-expansion@<2: '1.1.21'
  brace-expansion@>=4: '5.0.12'
  js-yaml@<4: '>=3.15.2'
  browserslist: '>=4.28.7'
  baseline-browser-mapping: '>=2.11.0'
  # Oct 2026 audit (H-11)
  proxy-addr: '>=2.0.8'
  sharp: '>=0.35.5'
  source-map-js: '>=1.2.2'
  prosemirror-view: '>=1.42.3'
  handlebars: '>=4.7.10'
