# Astro — self-hosted installation (customer servers).
#
# Images are pulled from the Astro registry; no application source is shipped.
# The API image runs V8 bytecode and enforces the signed license (Administration →
# Licence). Secrets come from `.env` next to this file: `cp .env.example .env`.
#
#   docker compose pull
#   docker compose up -d
#   docker compose run --rm api node dist/cli.js setup --org "My company" --email admin@example.com
#
# Only Caddy is published (80/443).
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp:size=256m"]

x-api-env: &api-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-astro}:${POSTGRES_PASSWORD}@postgres:5432/astro?connection_limit=${DB_POOL_PER_REPLICA:-10}&pool_timeout=10
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET (openssl rand -hex 32)}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY (openssl rand -hex 32)}
  TRUST_PROXY: ${TRUST_PROXY:-1}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: https://${FILES_DOMAIN}
  S3_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?set MINIO_APP_ACCESS_KEY}
  S3_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set MINIO_APP_SECRET_KEY}
  SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
  APP_URL: https://${APP_DOMAIN}
  # optional: the license key can also be installed from Administration → Licence
  LICENSE_KEY: ${ASTRO_LICENSE_KEY:-}
  NODE_ENV: production
  NODE_OPTIONS: --max-old-space-size=512

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    <<: *logging
    depends_on: [api, web, minio]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN:?set FILES_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: astro
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - max_connections=80
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    shm_size: 512m
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astro} -d astro"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    <<: *logging
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD (openssl rand -hex 32)}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    <<: *logging
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-astro}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: ["${MINIO_DATA_DIR:-miniodata}:/data"]

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    <<: *logging
    depends_on: [minio]
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-astro}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY}
    volumes: ["../minio/init.sh:/init.sh:ro"]

  # one-shot on every `up`: database migrations + reference data (idempotent)
  migrate:
    image: ${ASTRO_REGISTRY:-registry.astro.app}/astro/api:${ASTRO_VERSION:?set ASTRO_VERSION}
    restart: "no"
    <<: [*logging, *hardening]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *api-env
    command: ["sh", "-c", "node node_modules/prisma/build/index.js migrate deploy --schema prisma/schema.prisma && node dist/seed.js"]

  api:
    image: ${ASTRO_REGISTRY:-registry.astro.app}/astro/api:${ASTRO_VERSION:?set ASTRO_VERSION}
    restart: unless-stopped
    <<: [*logging, *hardening]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      <<: *api-env
      APP_ROLE: api
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits: { cpus: "1.5", memory: 700M }

  worker:
    image: ${ASTRO_REGISTRY:-registry.astro.app}/astro/api:${ASTRO_VERSION:?set ASTRO_VERSION}
    restart: unless-stopped
    <<: [*logging, *hardening]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      <<: *api-env
      APP_ROLE: worker
      NODE_OPTIONS: --max-old-space-size=768
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1G }

  web:
    # built for this installation's domains (they are compiled into the web bundle)
    image: ${ASTRO_REGISTRY:-registry.astro.app}/astro/web-${ASTRO_CUSTOMER:?set ASTRO_CUSTOMER}:${ASTRO_VERSION}
    restart: unless-stopped
    <<: [*logging, *hardening]
    tmpfs: ["/tmp:size=128m", "/app/apps/web/.next/cache:size=256m,uid=1000,gid=1000"]
    depends_on: [api]
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  backup:
    build: ../backup
    restart: unless-stopped
    <<: *logging
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-astro}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_REMOTE_KEEP_DAYS: ${BACKUP_REMOTE_KEEP_DAYS:-30}
      BACKUP_FILES_MODE: ${BACKUP_FILES_MODE:-sse-c}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:?set BACKUP_ENCRYPTION_PASSPHRASE (store it outside this server)}
    volumes: ["${BACKUP_DIR:-./backups}:/backups"]
    healthcheck:
      test: ["CMD-SHELL", "find /backups/last-success -mmin -1560 | grep -q ."]
      interval: 1h
      start_period: 26h

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
